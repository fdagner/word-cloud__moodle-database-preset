<div class="d-print-none wordcloud-right">
    <label for="wordcloud-auto-reload-toggle"><input type="checkbox" id="wordcloud-auto-reload-toggle"> Automatisch
        aktualisieren</label>
</div>
<script>
    // --- Auto reload without a full page reload ---
    // Fetches the page in the background and swaps ONLY the content of the
    // #wordcloud section. No flicker, scroll position is preserved.
    // 15 s interval and only while the tab is visible, to be kind to the
    // server: background tabs refresh on the next tick after returning.
    (function () {
        var toggle = document.getElementById('wordcloud-auto-reload-toggle');
        if (!toggle) {
            return;
        }
        var timer = null;

        function storeState(checked) {
            try {
                localStorage.setItem('wordcloudAutoReload', checked ? 'true' : 'false');
            } catch (e) { /* storage unavailable – setting stays temporary */ }
        }

        function refreshContent() {
            if (document.hidden) {
                return;
            }
            fetch(location.href, { credentials: 'same-origin' })
                .then(function (response) { return response.text(); })
                .then(function (html) {
                    var next = new DOMParser().parseFromString(html, 'text/html')
                        .getElementById('wordcloud');
                    var current = document.getElementById('wordcloud');
                    if (!next || !current) {
                        return;
                    }
                    // Only swap when the entries changed. Compare text content
                    // instead of innerHTML: DOM adjustments made by Moodle
                    // (e. g. extra classes) must not trigger a swap.
                    var nextList = next.querySelector('ul');
                    var currentList = current.querySelector('ul');
                    function listText(list) {
                        return list ? list.textContent.replace(/\s+/g, ' ').trim() : '';
                    }
                    if (nextList && currentList &&
                        listText(nextList) === listText(currentList)) {
                        return;
                    }
                    // Only swap when the word cloud can be redrawn afterwards,
                    // otherwise the cloud would disappear.
                    if (!window.WordCloud || typeof window.WordCloud.refresh !== 'function') {
                        return;
                    }
                    current.innerHTML = next.innerHTML;
                    window.WordCloud.refresh();
                })
                .catch(function () { /* network error: the next tick retries */ });
        }

        function applyAutoReload() {
            storeState(toggle.checked);
            if (toggle.checked && timer === null) {
                timer = setInterval(refreshContent, 15000);
            } else if (!toggle.checked && timer !== null) {
                clearInterval(timer);
                timer = null;
            }
        }

        // Restore the saved state
        try {
            toggle.checked = localStorage.getItem('wordcloudAutoReload') === 'true';
        } catch (e) { /* storage unavailable */ }
        toggle.addEventListener('change', applyAutoReload);
        applyAutoReload();
    })();
</script>

<script>
    // Once per session: show 1000 entries per page.
    if (typeof sessionStorage !== 'undefined' &&
        sessionStorage.getItem('WordCloudEntriesReload') === null) {
        sessionStorage.setItem('WordCloudEntriesReload', 'true');
        var params = new URLSearchParams(location.search);
        if (params.get('perpage') !== '1000') {
            params.set('perpage', '1000');
            window.history.replaceState({}, '', location.pathname + '?' + params.toString());
            window.location.reload();
        }
    }
</script>

<script>
    // Show/hide the entry cards. The functions are defined OUTSIDE the
    // #wordcloud section on purpose: they must survive the content swap
    // of the auto reload.
    function showEntries() {
        document.getElementById('wordcloud-entries-panel').style.display = 'block';
        document.getElementById('wordcloud-entries-hide').style.display = 'inline-block';
        document.getElementById('wordcloud-entries-show').style.display = 'none';
    }

    function hideEntries() {
        document.getElementById('wordcloud-entries-panel').style.display = 'none';
        document.getElementById('wordcloud-entries-show').style.display = 'inline-block';
        document.getElementById('wordcloud-entries-hide').style.display = 'none';
    }
</script>

<section id="wordcloud">
    <div id="wordcloud-output"></div>
    <div id="wordcloud-chart"></div>
    <br><div class="wordcloud-buttons">
    <input type="button" id="wordcloud-entries-show" class="btn btn-primary" value="Einträge anzeigen" onclick="showEntries()"><input type="button" id="wordcloud-entries-hide" class="btn btn-primary" value="Einträge ausblenden" onclick="hideEntries()" style="display:none"></div>
