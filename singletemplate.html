<div class="wordcloud-single ##approvalstatusclass##">
    <div class="wordcloud-single-head">
        ##userpicture##
        <span class="wordcloud-single-user">##user##</span>
        <div class="wordcloud-actions">##actionsmenu##</div>
    </div>
    <div class="wordcloud-single-field">
        <span class="wordcloud-single-label">Text 1:</span>
        [[Text1]]
    </div>
    <div class="wordcloud-single-field">
        <span class="wordcloud-single-label">Text 2:</span>
        [[Text2]]
    </div>
    <div class="wordcloud-single-field">
        <span class="wordcloud-single-label">Text 3:</span>
        [[Text3]]
    </div>
</div>
